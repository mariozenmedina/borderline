    <script id="theme-bootstrap">
      (function () {
        var theme = 'light'
        try {
          if (window.localStorage.getItem('borderline-theme') === 'dark') theme = 'dark'
        } catch {}
        document.documentElement.dataset.theme = theme
        var isMediakit = new URLSearchParams(window.location.search).get('view') === 'mediakit'
        document.documentElement.dataset.view = isMediakit ? 'mediakit' : 'site'
        document.documentElement.style.colorScheme = theme
        document.querySelector('meta[name="color-scheme"]').setAttribute('content', theme)
        document.querySelector('meta[name="theme-color"]').setAttribute('content', isMediakit ? (theme === 'dark' ? '#111111' : '#ffffff') : (theme === 'dark' ? '#171d1b' : '#f6f5f1'))
        if (isMediakit) {
          document.querySelector('meta[name="robots"]').setAttribute('content', 'noindex, nofollow')
          document.querySelector('meta[name="googlebot"]').setAttribute('content', 'noindex, nofollow')
        }
      })()
    </script>

    <script>
      (function () {
        var protocol = window.location.protocol
        var hostname = window.location.hostname
        var isLocalHost = hostname === 'localhost' ||
          hostname === '127.0.0.1' ||
          hostname === '0.0.0.0' ||
          hostname === '::1' ||
          hostname === '[::1]' ||
          hostname.endsWith('.localhost')

        if (protocol === 'http:' && !isLocalHost) {
          window.location.replace('https:' + window.location.href.slice(protocol.length))
        }
      })()
    </script>
