name: V2 checks

on:
  pull_request:
    branches: [v2, main]
  push:
    branches: [v2]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: v2-checks-${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  build-and-logic:
    name: Build PT/EN and logic
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: '24'
      - uses: pnpm/action-setup@f40ffcd9367d9f12939873eb1018b921a783ffaa # v4
        with:
          version: 11.5.3
      - name: Install locked dependencies
        run: pnpm install --frozen-lockfile
      - name: Test logic without browser
        run: node --test tests/*.test.mjs
      - name: Build Portuguese and English
        run: pnpm build
